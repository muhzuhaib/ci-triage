[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-triage"
version = "0.2.0"
description = "Webhook-driven CI failure triage with a hard per-run LLM spend ceiling and exactly-once side effects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Muhammad Zuhaib Zahid" }]
keywords = ["webhook", "llm", "cost-control", "idempotency", "dead-letter-queue", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# The budget ledger and the run state machine are the core, and they depend on
# nothing but SQLAlchemy so the guarantees can be tested in seconds anywhere.
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_triage"]
# prices.json is data the package reads at runtime, not a source file. Without
# this it is silently dropped from the wheel and the install works right up
# until the first call is costed.
artifacts = ["src/ci_triage/prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
