name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The guarantees have to hold on the database people will actually deploy on,
  # not only on the one that makes them easy. SQLite serialises writers, which
  # can mask a race that Postgres exposes -- so the same suite runs on both.
  sqlite:
    name: tests (sqlite, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  postgres:
    name: tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_triage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,postgres]"
      - run: python -m pytest -q
        env:
          CI_TRIAGE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ci_triage_test
